<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>德信 - DeChat</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Auth -->
  <div id="auth-page" class="auth-page">
    <div class="auth-container">
      <div class="auth-header">
        <h1>德信</h1>
        <p class="auth-subtitle">DeChat · 实时聊天室</p>
      </div>
      <div id="login-form" class="auth-form">
        <h2>登录</h2>
        <div class="form-group"><input type="text" id="login-username" placeholder="用户名" autocomplete="username"></div>
        <div class="form-group"><input type="password" id="login-password" placeholder="密码" autocomplete="current-password"></div>
        <div class="form-error" id="login-error"></div>
        <button class="btn btn-primary" id="login-btn">登录</button>
        <p class="auth-switch">还没有账号？<a href="#" id="show-register">立即注册</a></p>
      </div>
      <div id="register-form" class="auth-form" style="display:none">
        <h2>注册</h2>
        <div class="form-group"><input type="text" id="reg-username" placeholder="用户名" autocomplete="username"></div>
        <div class="form-group"><input type="text" id="reg-nickname" placeholder="昵称"></div>
        <div class="form-group"><input type="password" id="reg-password" placeholder="密码（至少 6 位）" autocomplete="new-password"></div>
        <div class="form-group"><input type="password" id="reg-confirm" placeholder="确认密码" autocomplete="new-password"></div>
        <div class="form-error" id="register-error"></div>
        <button class="btn btn-primary" id="register-btn">注册</button>
        <p class="auth-switch">已有账号？<a href="#" id="show-login">去登录</a></p>
      </div>
    </div>
  </div>

  <!-- Chat -->
  <div id="chat-page" class="chat-page" style="display:none">
    <div class="chat-sidebar">
      <div class="sidebar-header">
        <div class="user-info">
          <span class="user-avatar" id="my-avatar"></span>
          <span class="user-nickname" id="my-nickname"></span>
          <button class="btn btn-sm" id="logout-btn">退出</button>
        </div>
      </div>
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" data-tab="conversations">会话</button>
        <button class="sidebar-tab" data-tab="friends">好友</button>
        <button class="sidebar-tab" data-tab="groups">群组</button>
      </div>
      <div class="sidebar-content" id="sidebar-content">
        <!-- conversations tab -->
        <div class="tab-pane active" id="pane-conversations">
          <div class="conv-list" id="conversation-list"></div>
        </div>
        <!-- friends tab -->
        <div class="tab-pane" id="pane-friends">
          <div class="pane-header"><button class="btn btn-sm btn-outline" id="add-friend-btn">+ 添加好友</button></div>
          <div class="pane-section"><h4>好友请求</h4><div id="friend-requests"></div></div>
          <div class="pane-section"><h4>我的好友</h4><div id="friend-list"></div></div>
        </div>
        <!-- groups tab -->
        <div class="tab-pane" id="pane-groups">
          <div class="pane-header"><button class="btn btn-sm btn-outline" id="create-group-btn">+ 创建群组</button></div>
          <div class="pane-section"><div id="group-list"></div></div>
        </div>
      </div>
      <div class="sidebar-footer"><p>支持 Markdown · LaTeX · 图片 · GIF</p></div>
    </div>

    <div class="chat-main">
      <div class="chat-header" id="chat-header">
        <span class="chat-header-title" id="chat-title">选择一个会话</span>
        <span class="chat-header-meta" id="chat-meta"></span>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="welcome-msg"><p>选择一个会话开始聊天</p></div>
      </div>
      <div class="chat-input-area" id="chat-input-area" style="display:none">
        <div class="input-toolbar">
          <button class="toolbar-btn" id="emoji-btn" title="表情">😊</button>
          <button class="toolbar-btn" id="image-btn" title="图片">🖼️</button>
          <input type="file" id="image-input" accept="image/*" style="display:none">
          <span class="toolbar-hint">支持 Markdown & LaTeX</span>
        </div>
        <div id="emoji-picker" class="emoji-picker" style="display:none">
          <div class="emoji-tabs">
            <button class="emoji-tab active" data-category="emoji">😊 表情</button>
            <button class="emoji-tab" data-category="gif">🎭 动图</button>
          </div>
          <div class="emoji-content" id="emoji-content"></div>
        </div>
        <div class="input-row">
          <textarea id="message-input" placeholder="输入消息..." rows="3"></textarea>
          <button class="btn btn-primary send-btn" id="send-btn">发送</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Dialogs -->
  <div class="modal-overlay" id="modal-overlay" style="display:none">
    <div class="modal" id="add-friend-modal">
      <div class="modal-header"><h3>添加好友</h3><button class="modal-close">&times;</button></div>
      <div class="modal-body">
        <div class="form-group"><input type="text" id="search-user-input" placeholder="输入用户名搜索"></div>
        <div class="search-results" id="search-results"></div>
        <div class="form-error" id="add-friend-error"></div>
      </div>
    </div>
    <div class="modal" id="friend-requests-modal">
      <div class="modal-header"><h3>好友请求</h3><button class="modal-close">&times;</button></div>
      <div class="modal-body" id="requests-list"></div>
    </div>
    <div class="modal" id="create-group-modal">
      <div class="modal-header"><h3>创建群组</h3><button class="modal-close">&times;</button></div>
      <div class="modal-body">
        <div class="form-group"><input type="text" id="group-name-input" placeholder="群组名称"></div>
        <div class="form-group"><label>选择好友加入：</label></div>
        <div class="friend-select" id="friend-select"></div>
        <div class="form-error" id="create-group-error"></div>
        <button class="btn btn-primary" id="confirm-create-group">创建群组</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/socket.io@4.8.0/client-dist/socket.io.min.js"></script>
  <script src="/js/emoji.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
